name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Fetch ffmpeg
        run: Tools/fetch-ffmpeg.sh
      - name: Test
        run: CONVERTZ_FFMPEG_DIR="$PWD/vendor/ffmpeg" swift test
      - name: Build app
        run: ./build.sh
      - name: Check bundle
        run: |
          lipo -archs build/ConvertZ.app/Contents/MacOS/ConvertZ
          plutil -lint build/ConvertZ.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose build/ConvertZ.app
          build/ConvertZ.app/Contents/Helpers/ffmpeg -version | head -1
